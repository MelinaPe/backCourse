paths: 
  /api/users: 
    get:
      summary: Get all users from the database
      tags:
        - Users
      responses:
        "200":
          description: It gets all users successfully
          content: 
            application/json:
              schema: 
                type: array
                items: 
                  $ref: '#/components/schemas/User'
              examples:
                example-1:
                  value:
                    - _id: "64a18c43b1246b2f456fa3d6"
                      first_name: "John"
                      last_name: "Doe"
                      email: "john.doe@example.com"
                      role: "user"
                      age: 30
                      password: "hashed_password"
                    - _id: "64a18c53b1246b2f456fa3d7"
                      first_name: "Jane"
                      last_name: "Smith"
                      email: "jane.smith@example.com"
                      role: "admin"
                      age: 28
                      password: "hashed_password"
        "500":
          description: Internal server error 
  /api/users/{uid}:
    get:
      summary: Get a user by ID
      tags:
        - users
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          description: ID of the user to retrieve
      responses:
        "200":
          description: User retrieved successfully
          content: 
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
        "500":
          description: Internal server error 

components:
  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          description: ID autogenerated by MongoDB
        first_name:
          type: string
          description: User's first name 
        last_name:
          type: string
          description: User's last name
        email:
          type: string
          description: User's email
        role:
          type: string
          description: User's role (e.g., user, admin)
        age:
          type: integer  
          description: User's age
        password:
          type: string
          description: User's password (hashed)
        