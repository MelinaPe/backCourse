paths:
  /api/carts:
    get:
      summary: Get all carts from the database
      tags:
        - Carts
      responses:
        "200":
          description: It gets all carts successfully
          content: 
            application/json:
              schema: 
                type: array
                items: 
                  $ref: '#/components/schemas/Cart'
              examples:
                example-1:
                  value:
                    - _id: "64a18c43b1246b2f456fa3da"
                      cartId: "be972d0d-1e09-4d5f-a8d9-66e6737d4d89"
                      products:
                        - product: "64a18c43b1246b2f456fa3d9"
                          quantity: 2
                        - product: "64a18c53b1246b2f456fa3d8"
                          quantity: 1
                      createdAt: "2024-08-16T09:40:24.228Z"
        "500":
          description: Internal server error 
components:
  schemas:
    Cart:
      type: object
      properties:
        _id:
          type: string
          description: ID autogenerated by MongoDB
        cartId:
          type: string
          description: Unique cart identifier
        products:
          type: array
          items: 
            type: object
            properties:
              product:
                type: string
                description: Product ID
              quantity:
                type: integer
                description: Quantity of the product in the cart
        createdAt:
          type: string
          format: date-time
          description: Cart creation date
